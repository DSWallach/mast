experimental = ["setup-scripts"]

# cargo-nextest configuration for the Mast workspace.
#
# Scope: engine, mcp, harness, proto and the other non-UI crates. The UI crate
# (mast-ui) is NOT run under nextest: its gpui tests share process-global state and
# need one thread in one process, which `cargo test -p mast-ui --lib -- --test-threads=1`
# provides and nextest (one process per test) does not. See
# docs/internal/plans/work-outline/release-testing.md.
#
# Profiles
#   default     local development; quarantined tests run and may fail.
#   release     excludes the quarantined tests; any failure is a new failure.
#   quarantine  runs only the quarantined tests; failures are expected.
#
# The quarantine list is duplicated in `profile.release.default-filter` and
# `profile.quarantine.default-filter` because nextest has no named filter sets.
# Edit both together. Each entry is a `test(~name)` substring match, optionally
# scoped by a module-path test filter.

# Keep native FSEvents for watcher coverage. Other isolated engine tests use
# periodic repair, avoiding registration contention in the macOS daemon.
[scripts.setup.engine-repair-only]
command = { command-line = 'scripts/nextest-engine-repair-only.sh', relative-to = 'workspace-root' }

[[profile.default.scripts]]
platform = 'cfg(target_os = "macos")'
filter = 'package(mast-engine) & not (test(/^diff_sync_/) | test(/^workspace_files::/) | test(/m5_repos_diffs_terminals::diff_sync_publishes_without_rewriting_chat_branch$/) | test(/m5_repos_diffs_terminals::git_status_stream_is_scoped_deduplicated_and_resets_after_commit$/) | test(/device_routing::workspace_file_surface_proxies_over_the_relay$/))'
setup = 'engine-repair-only'

# Tests that open PTYs / spawn login shells and git processes time out when many
# run at once (observed 2026-11-03: every m5_repos_diffs_terminals test hit the 3 min
# limit at 8 threads). Limit them to two concurrent tests; the rest still run wide.
[test-groups]
terminal-heavy = { max-threads = 2 }
# Each diff_sync binary registers dozens of FSEvents watchers (two at a time per process);
# several in parallel saturate fseventsd and time out on "startup settles" (releases 105/106).
fsevents-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(binary(engine) & test(/^managed_accounts::/)) | (binary(engine) & test(/^m5_repos_diffs_terminals::/)) | (binary(engine) & test(/^pr_ticket_cache_login_shell::/))'
test-group = 'terminal-heavy'

[[profile.release.overrides]]
filter = '(binary(engine) & test(/^managed_accounts::/)) | (binary(engine) & test(/^m5_repos_diffs_terminals::/)) | (binary(engine) & test(/^pr_ticket_cache_login_shell::/))'
test-group = 'terminal-heavy'

[[profile.quarantine.overrides]]
filter = '(binary(engine) & test(/^managed_accounts::/)) | (binary(engine) & test(/^m5_repos_diffs_terminals::/)) | (binary(engine) & test(/^pr_ticket_cache_login_shell::/))'
test-group = 'terminal-heavy'

# Watch attach for 50 checkouts takes ~50 s alone; under a parallel release run these
# tests passed 3 min (2026-11-17). Their assertions are git-spawn counts, not time. Run
# them one at a time with a 5-minute limit.
[[profile.release.overrides]]
filter = 'binary(engine) & test(/^diff_sync_/)'
test-group = 'fsevents-heavy'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'binary(engine) & test(/^diff_sync_/)'
test-group = 'fsevents-heavy'

[profile.default]
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.release]
test-threads = 8
# A test running 3 minutes is hung: terminate it and report a failure.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
default-filter = '''
not (
    test(~capture_source_context_reads_the_dispatch_checkout)
  | test(~hand_off_reclaims_a_queued_worker_report)
  | test(~blame_cache_hit_and_idle_stay_within_the_git_budget)
  | test(~holder_probe_reports_pid_without_disturbing_the_lock)
  | test(~headless_sign_out_closes_joined_edge_rooms_and_stops_daemon)
  | test(~mutations_stay_fast_on_a_large_local_registry)
  | test(~stalled_prompt_post_has_a_bounded_timeout)
  | test(~blocking_questions_own_actions_and_the_rest_roll_up_without_duplicates)
  | test(~cursor_login_flow_spawns_shim_and_auto_activates)
  | test(~codex_login_resolves_override_and_adds_its_directory_to_child_path)
  | ((binary(engine) & test(/^instruction_delivery::/)) & (test(~a_missing_revision_waits_then_fails_and_never_substitutes) | test(~a_revision_that_syncs_during_the_wait_is_delivered)))
  | ((binary(engine) & test(/^external_import_links_repair::/)) & test(~repair_))
  | test(~workspace_file_surface_proxies_over_the_relay)
  | test(~workspace_file_rpcs_list_search_read_write_and_watch)
  | test(~codex_login_honors_override_only_installation)
  | test(~login_child)
  | (binary(engine) & test(/^pr_ticket_cache_login_shell::/))
  | ((binary(engine) & test(/^managed_accounts::/)) & (test(~sign_in)))
  | test(~setting_the_destination_syncs_the_space)
  | test(~models_discovers_visible_catalog_with_pagination)
  | test(~generated_image_is_materialized_before_publication_and_survives_reopen)
  | test(~sync_picks_up_a_closed_message_but_defers_the_new_open_reply)
  | test(~titling_e2e_names_chat_and_renames_worktree_branch)
  | test(~remote_preview_churn_does_not_accumulate_tasks_or_memory)
  | test(~actual_webrtc_pair_streams_in_both_directions)
  | test(~same_seed_same_hash_different_seed_different_hash)
)
'''

[profile.quarantine]
test-threads = 2
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
status-level = "retry"
default-filter = '''
    test(~capture_source_context_reads_the_dispatch_checkout)
  | test(~hand_off_reclaims_a_queued_worker_report)
  | test(~blame_cache_hit_and_idle_stay_within_the_git_budget)
  | test(~holder_probe_reports_pid_without_disturbing_the_lock)
  | test(~headless_sign_out_closes_joined_edge_rooms_and_stops_daemon)
  | test(~mutations_stay_fast_on_a_large_local_registry)
  | test(~stalled_prompt_post_has_a_bounded_timeout)
  | test(~blocking_questions_own_actions_and_the_rest_roll_up_without_duplicates)
  | test(~cursor_login_flow_spawns_shim_and_auto_activates)
  | test(~codex_login_resolves_override_and_adds_its_directory_to_child_path)
  | ((binary(engine) & test(/^instruction_delivery::/)) & (test(~a_missing_revision_waits_then_fails_and_never_substitutes) | test(~a_revision_that_syncs_during_the_wait_is_delivered)))
  | ((binary(engine) & test(/^external_import_links_repair::/)) & test(~repair_))
  | test(~workspace_file_surface_proxies_over_the_relay)
  | test(~workspace_file_rpcs_list_search_read_write_and_watch)
  | test(~codex_login_honors_override_only_installation)
  | test(~login_child)
  | (binary(engine) & test(/^pr_ticket_cache_login_shell::/))
  | ((binary(engine) & test(/^managed_accounts::/)) & (test(~sign_in)))
  | test(~setting_the_destination_syncs_the_space)
  | test(~models_discovers_visible_catalog_with_pagination)
  | test(~generated_image_is_materialized_before_publication_and_survives_reopen)
  | test(~sync_picks_up_a_closed_message_but_defers_the_new_open_reply)
  | test(~titling_e2e_names_chat_and_renames_worktree_branch)
  | test(~remote_preview_churn_does_not_accumulate_tasks_or_memory)
  | test(~actual_webrtc_pair_streams_in_both_directions)
  | test(~same_seed_same_hash_different_seed_different_hash)
'''
