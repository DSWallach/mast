[package]
name = "mast"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mast"
path = "src/main.rs"

[[bin]]
name = "zeron"
path = "src/main.rs"

[dependencies]
mast-proto.workspace = true
mast-engine.workspace = true
mast-harness.workspace = true
mast-rpc.workspace = true
mast-ui.workspace = true
mast-update.workspace = true
mast-mcp.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
serde.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
ctor = "1"
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
