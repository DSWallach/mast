[package]
name = "mast-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
snapshot = ["mast-ui/snapshot"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-base.workspace = true
mast-ui = { workspace = true, features = ["dev-inspector", "snapshot"] }
mast-theme.workspace = true
mast-doc.workspace = true
mast-proto.workspace = true
tempfile.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
