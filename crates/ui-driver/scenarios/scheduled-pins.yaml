name: scheduled-pins
world: { preset: scheduled-pins, seed: 1 }
screenshot: every-step
steps:
  - expect:
      visible: "#work-outline"
      bounds:
        outline-row-scheduled-fixture-task-1-0: { top_edge_within: [0, 760] }
        outline-row-scheduled-fixture-task-1-1: { top_edge_within: [0, 760] }
    criterion: scheduled-pins.1
    caption: Overview shows the work outline and both scheduled tasks, neither pinned.
  - key: "mod-,"
    caption: Open Settings.
  - click: "#settings-nav-Appearance"
    caption: Open Appearance.
  - scroll: { at: "#appearance-page", dy: -1000 }
    caption: Find the sidebar settings.
  - click: "#pinned-always-visible-toggle-off"
    caption: Turn on Pinned items are always visible.
  - expect: { visible: "#pinned-always-visible-toggle-on" }
    criterion: scheduled-pins.2
    caption: Appearance shows Pinned items are always visible is on.
  - click: "#settings-back"
    caption: Return to the workspace.
  - click: "#outline-disclosure-scheduled"
    caption: Collapse Scheduled with nothing pinned.
  - expect:
      not_visible: "#outline-row-scheduled-fixture-task-1-0"
    criterion: scheduled-pins.3
    caption: With no pins, collapsing hides every scheduled task.
  - click: "#outline-disclosure-scheduled"
    caption: Expand Scheduled.
  - right_click: "#outline-row-scheduled-fixture-task-1-0"
    caption: Open the Weekly report row menu.
  - click: "#chat-menu-pin"
    caption: Pin Weekly report from the row menu.
  - click: "#outline-disclosure-scheduled"
    caption: Collapse Scheduled.
  - expect:
      visible: "#outline-row-scheduled-fixture-task-1-0"
      not_visible: "#outline-row-scheduled-fixture-task-1-1"
    criterion: scheduled-pins.4
    caption: Weekly report stays visible and Morning briefing is hidden.
  - restart
  - key: "mod-,"
    caption: Open Settings; a restarted flow session starts from default settings.
  - click: "#settings-nav-Appearance"
    caption: Open Appearance.
  - scroll: { at: "#appearance-page", dy: -1000 }
    caption: Find the sidebar settings.
  - click: "#pinned-always-visible-toggle-off"
    caption: Turn Pinned items are always visible back on.
  - click: "#settings-back"
    caption: Return to the workspace.
  - click: "#outline-disclosure-scheduled"
    caption: Collapse Scheduled again after the restart.
  - expect:
      visible: "#outline-row-scheduled-fixture-task-1-0"
      not_visible: "#outline-row-scheduled-fixture-task-1-1"
    criterion: scheduled-pins.5
    caption: After a restart the pin survived, so Weekly report is still shown under a collapsed Scheduled.
  - click: "#outline-row-scheduled-fixture-task-1-0"
    caption: Open the pinned task's latest run.
  - expect:
      visible: "#transcript-region"
    criterion: scheduled-pins.6
    caption: The pinned task's run opens in the run view.
  - expect:
      visible: "#outline-row-scheduled-fixture-task-1-0"
    caption: The pinned task's row stays in the outline beside the run view.
  - right_click: "#outline-row-scheduled-fixture-task-1-0"
    caption: Open the Weekly report row menu again.
  - click: "#chat-menu-pin"
    caption: Unpin Weekly report.
  - expect:
      not_visible: "#outline-row-scheduled-fixture-task-1-0"
    criterion: scheduled-pins.7
    caption: With Scheduled still collapsed, the unpinned task leaves the outline.
