# Settings → Accounts, Quota caps, on the embedded engine: move a provider's hard-cap slider, see
# an invalid cap refused, then save. The world seeds engine data only; every step below is a UI action.
# The page has no a11y text nodes, so state is read through selectors that carry it:
# #quota-cap-value-<provider>-<percent> marks the shown cap, #quota-caps-error the refusal.
name: settings-accounts
world: { preset: small, seed: 1 }
screenshot: every-step
steps:
  - key: "mod-,"
    caption: Open Settings.
  - click: "#settings-nav-Accounts"
    caption: Open Accounts.
  - scroll: { at: "#accounts-page", dy: -4000 }
    caption: Scroll down to Quota caps.
  - expect:
      visible: "#quota-cap-value-codex-85"
    criterion: quota-caps.1
    caption: Codex starts on the 85% default hard cap.
  - expect: { visible: "#quota-caps-save-disabled" }
    criterion: quota-caps.2
    caption: Nothing has changed, so Save is disabled.
  - click: "#quota-cap-codex-80"
    caption: Click the 80% notch on Codex's slider.
  - expect:
      visible: "#quota-cap-value-codex-80"
    criterion: quota-caps.3
    caption: Codex's hard cap reads 80%.
  - expect:
      visible: "#quota-caps-save-enabled"
    criterion: quota-caps.4
    caption: The change is valid, so Save is on.
  - expect:
      visible: "#quota-cap-value-claude-code-85"
    caption: Claude Code stays on 85%.
  - click: "#quota-cap-claude-code-95"
    caption: Click the 95% notch on Claude Code's slider, above the 90% freeze cap.
  - expect:
      visible: "#quota-caps-error"
    criterion: quota-caps.5
    caption: The page says why 95% can't be saved.
  - click: "#quota-cap-claude-code-85"
    caption: Click back to the 85% notch.
  - expect:
      not_visible: "#quota-caps-error"
    criterion: quota-caps.6
    caption: The message goes away.
  - click: "#quota-caps-save-enabled"
    caption: Save.
  - scroll: { at: "#accounts-page", dy: -40 }
    caption: Scroll the page so the saved state is drawn.
  - expect:
      visible: "#quota-caps-save-disabled"
      timeout_ms: 10000
    criterion: quota-caps.7
    caption: Saved, so Save is off again and the 80% stays on Codex.
  - expect:
      visible: "#quota-cap-value-codex-80"
    caption: The saved 80% is still on Codex.
